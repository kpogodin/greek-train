name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}       # placeholder: VM IP or domain, e.g. 203.0.113.10
          username: ${{ secrets.VM_USER }}   # placeholder: deploy user, e.g. deploy
          key: ${{ secrets.VM_SSH_KEY }}     # placeholder: private key matching a pubkey in ~deploy/.ssh/authorized_keys on the VM
          port: ${{ secrets.VM_SSH_PORT }}   # placeholder: usually 22
          script: |
            cd /opt/greek-train/app
            git fetch origin main
            git reset --hard origin/main
            bash deploy/deploy.sh
